<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TinyLink — Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="brand">TinyLink</h1>
      <nav class="nav">
        <a href="/" class="nav-link">Dashboard</a>
      </nav>
    </div>
  </header>

  <main class="container main-grid">
    <section class="card create-card">
      <h2>Create short link</h2>
      <form id="createForm" class="form">
        <label class="field">
          <div class="label">Long URL</div>
          <input id="url" type="url" placeholder="https://example.com/..." required />
        </label>

        <label class="field">
          <div class="label">Custom code (optional, 6–8 alphanum)</div>
          <input id="code" type="text" placeholder="e.g. docs123" maxlength="8" />
        </label>

        <div class="form-actions">
          <button id="submitBtn" class="btn primary">Create</button>
          <div id="formMsg" class="msg" role="status"></div>
        </div>
      </form>
      <div class="hint">Tip: include protocol (https://). Duplicate codes return 409.</div>
    </section>

    <section class="card list-card">
      <div class="list-header">
        <h2>Your links</h2>
        <input id="search" placeholder="Search by code or URL" class="search"/>
      </div>
      <div class="table-wrap">
        <table class="links-table" aria-live="polite">
          <thead>
            <tr>
              <th>Code</th>
              <th>Target</th>
              <th>Clicks</th>
              <th>Last clicked</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="linksTbody">
            <tr><td colspan="5" class="empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">Made with ❤️ • <small>TinyLink</small></div>
  </footer>

  <script src="/app.js" defer></script>
</body>
</html>
